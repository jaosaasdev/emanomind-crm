<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EMANOMIND · CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --accent: #f0a07a;
    --ink: #f4efe8;
    --muted: #c4bbaf;
    --glass: rgba(28, 25, 22, 0.62);
    --glass-hi: rgba(38, 34, 30, 0.82);
  }
  body { font-family: 'Urbanist', system-ui, sans-serif; background: #000; color: var(--ink); margin: 0; }
  .backdrop { position: fixed; inset: 0; z-index: 0; }
  .backdrop img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.06); filter: brightness(0.42) contrast(1.08); }
  .backdrop::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14,12,10,0.78) 0%, rgba(14,12,10,0.5) 45%, rgba(14,12,10,0.72) 100%); }
  .glass { background: var(--glass); backdrop-filter: blur(26px) saturate(1.6); border: 1px solid rgba(255,255,255,0.08); }
  .glass-hi { background: var(--glass-hi); backdrop-filter: blur(20px) saturate(1.4); border: 1px solid rgba(255,255,255,0.07); }
  .topnav { position: relative; }
  .pill { position: absolute; top: 4px; height: calc(100% - 8px); background: var(--accent); border-radius: 999px; transition: all 0.5s cubic-bezier(.22,1,.36,1); z-index: 0; }
  .nav-btn { transition: color 0.25s ease, transform 0.15s ease; }
  .nav-btn:active { transform: scale(0.96); }
  button, .deal, .proposta-card, .projeto-card, .cliente-card, .lead-card, .processo-card, .contrato-card {
    transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  button:active { transform: scale(0.97); }
  .deal:hover, .proposta-card:hover, .projeto-card:hover, .cliente-card:hover, .lead-card:hover, .processo-card:hover, .contrato-card:hover {
    transform: translateY(-2px);
  }
  .bg-\[var\(--accent\)\]:hover { filter: brightness(1.05); }
  .bg-\[var\(--accent\)\]:active { filter: brightness(0.95); }
  .deal { transition: transform 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease; }
  .deal:hover { transform: translateY(-2px); }
  .deal.dragging { opacity: 0.5; transform: scale(0.96); box-shadow: 0 10px 30px -10px rgba(240,160,122,0.4); }
  .kanban-col { transition: box-shadow 0.2s ease, background 0.2s ease; }
  .kanban-col.drag-over { box-shadow: inset 0 0 0 1px var(--accent); background: rgba(240,160,122,0.06); }
  .proposta-card { transition: background 0.2s ease; }
  .proposta-card:hover { background: rgba(255,255,255,0.04); }
  .page-enter { animation: pageIn 0.45s cubic-bezier(.22,1,.36,1) both; }
  @keyframes pageIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="backdrop">
  <img src="https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?w=1800&q=75" alt="" />
</div>

<header class="glass fixed top-0 left-0 right-0 z-20 flex items-center gap-8 px-8 py-3.5">
  <a href="#" class="flex items-center gap-2.5 no-underline text-[var(--ink)]">
    <div class="w-8 h-8 rounded-lg bg-[var(--accent)] grid place-items-center font-bold text-[#1a120e] text-sm">E</div>
    <div>
      <div class="font-semibold tracking-wide">EMANOMIND</div>
      <div class="text-[11px] text-[var(--muted)] -mt-0.5">Branding & Automation</div>
    </div>
  </a>

  <nav id="nav" class="topnav flex bg-black/30 p-1 rounded-full">
    <div id="pill" class="pill"></div>
    <button data-page="visao" class="nav-btn px-4 py-2 text-[13.5px] font-medium text-[var(--muted)] rounded-full">Visão Geral</button>
    <button data-page="pipeline" class="nav-btn px-4 py-2 text-[13.5px] font-medium text-[var(--muted)] rounded-full">Pipeline</button>
    <button data-page="projetos" class="nav-btn px-4 py-2 text-[13.5px] font-medium text-[var(--muted)] rounded-full">Projetos</button>
    <button data-page="processos" class="nav-btn px-4 py-2 text-[13.5px] font-medium text-[var(--muted)] rounded-full">Processos</button>
    <button data-page="leads" class="nav-btn px-4 py-2 text-[13.5px] font-medium text-[var(--muted)] rounded-full">Leads</button>
    <button data-page="propostas" class="nav-btn px-4 py-2 text-[13.5px] font-medium text-[var(--muted)] rounded-full">Propostas</button>
    <button data-page="contratos" class="nav-btn px-4 py-2 text-[13.5px] font-medium text-[var(--muted)] rounded-full">Contratos</button>
    <button data-page="clientes" class="nav-btn px-4 py-2 text-[13.5px] font-medium text-[var(--muted)] rounded-full">Clientes</button>
    <button data-page="equipe" class="nav-btn px-4 py-2 text-[13.5px] font-medium text-[var(--muted)] rounded-full">Equipe</button>
    <button data-page="relatorios" class="nav-btn px-4 py-2 text-[13.5px] font-medium text-[var(--muted)] rounded-full">Relatórios</button>
  </nav>

  <div class="ml-auto flex items-center gap-3">
    <button class="glass px-3 py-1.5 rounded-full text-xs">⌘K</button>
    <button class="bg-[var(--accent)] text-[#1a120e] px-4 py-1.5 rounded-full text-sm font-semibold">Novo projeto</button>
  </div>
</header>

<main id="main" class="relative z-10 pt-24 px-10 pb-16 max-w-7xl mx-auto"></main>

<script>
/* Full CRM logic is in the complete file. Download the local index.html for the full version. */
console.log('EMANOMIND CRM - see full file');
</script>
</body>
</html>
