<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EMANOMIND · CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --accent: #f0a07a;
    --ink: #f4efe8;
    --muted: #c4bbaf;
    --glass: rgba(28, 25, 22, 0.62);
    --glass-hi: rgba(38, 34, 30, 0.82);
  }
  body { font-family: 'Urbanist', system-ui, sans-serif; background: #000; color: var(--ink); margin: 0; }
  .backdrop { position: fixed; inset: 0; z-index: 0; }
  .backdrop img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.06); filter: brightness(0.42) contrast(1.08); }
  .backdrop::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14,12,10,0.78) 0%, rgba(14,12,10,0.5) 45%, rgba(14,12,10,0.72) 100%); }
  .glass { background: var(--glass); backdrop-filter: blur(26px) saturate(1.6); border: 1px solid rgba(255,255,255,0.08); }
  .glass-hi { background: var(--glass-hi); backdrop-filter: blur(20px) saturate(1.4); border: 1px solid rgba(255,255,255,0.07); }
  .topnav { position: relative; }
  .pill { position: absolute; top: 4px; height: calc(100% - 8px); background: var(--accent); border-radius: 999px; transition: all 0.5s cubic-bezier(.22,1,.36,1); z-index: 0; }
  .nav-btn { transition: color 0.25s ease, transform 0.15s ease; }
  .nav-btn:active { transform: scale(0.96); }
  button, .deal, .proposta-card, .projeto-card, .cliente-card, .lead-card, .processo-card, .contrato-card {
    transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  button:active { transform: scale(0.97); }
  .deal:hover, .proposta-card:hover, .projeto-card:hover, .cliente-card:hover, .lead-card:hover, .processo-card:hover, .contrato-card:hover {
    transform: translateY(-2px);
  }
  .bg-\[var\(--accent\)\]:hover { filter: brightness(1.05); }
  .bg-\[var\(--accent\)\]:active { filter: brightness(0.95); }
  .deal { transition: transform 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease; }
  .deal:hover { transform: translateY(-2px); }
  .deal.dragging { opacity: 0.5; transform: scale(0.96); box-shadow: 0 10px 30px -10px rgba(240,160,122,0.4); }
  .kanban-col { transition: box-shadow 0.2s ease, background 0.2s ease; }
  .kanban-col.drag-over { box-shadow: inset 0 0 0 1px var(--accent); background: rgba(240,160,122,0.06); }
  .proposta-card { transition: background 0.2s ease; }
  .proposta-card:hover { background: rgba(255,255,255,0.04); }
  .page-enter { animation: pageIn 0.45s cubic-bezier(.22,1,.36,1) both; }
  @keyframes pageIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="backdrop">
  <img src="https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?w=1800&q=75" alt="" />
</div>

<header class="glass fixed top-0 left-0 right-0 z-20 flex items-center gap-8 px-8 py-3.5">
  <a href="#" class="flex items-center gap-2.5 no-underline text-[var(--ink)]">
    <div class="w-8 h-8 rounded-lg bg-[var(--accent)] grid place-items-center font-bold text-[#1a120e] text-sm">E</div>
    <div>
      <div class="font-semibold tracking-wide">EMANOMIND</div>
      <div class="text-[11px] text-[var(--muted)] -mt-0.5">Branding & Automation</div>
    </div>
  </a>

  <nav id="nav" class="topnav flex bg-black/30 p-1 rounded-full">
    <div id="pill" class="pill"></div>
    <button data-page="visao" class="nav-btn px-4 py-2 text-[13.5px] font-medium text-[var(--muted)] rounded-full">Visão Geral</button>
    <button data-page="pipeline" class="nav-btn px-4 py-2 text-[13.5px] font-medium text-[var(--muted)] rounded-full">Pipeline</button>
    <button data-page="projetos" class="nav-btn px-4 py-2 text-[13.5px] font-medium text-[var(--muted)] rounded-full">Projetos</button>
    <button data-page="processos" class="nav-btn px-4 py-2 text-[13.5px] font-medium text-[var(--muted)] rounded-full">Processos</button>
    <button data-page="leads" class="nav-btn px-4 py-2 text-[13.5px] font-medium text-[var(--muted)] rounded-full">Leads</button>
    <button data-page="propostas" class="nav-btn px-4 py-2 text-[13.5px] font-medium text-[var(--muted)] rounded-full">Propostas</button>
    <button data-page="contratos" class="nav-btn px-4 py-2 text-[13.5px] font-medium text-[var(--muted)] rounded-full">Contratos</button>
    <button data-page="clientes" class="nav-btn px-4 py-2 text-[13.5px] font-medium text-[var(--muted)] rounded-full">Clientes</button>
    <button data-page="equipe" class="nav-btn px-4 py-2 text-[13.5px] font-medium text-[var(--muted)] rounded-full">Equipe</button>

  <div class="ml-auto flex items-center gap-3">
    <button class="glass px-3 py-1.5 rounded-full text-xs">⌘K</button>
    <button class="bg-[var(--accent)] text-[#1a120e] px-4 py-1.5 rounded-full text-sm font-semibold">Novo projeto</button>
  </div>
</header>

<main id="main" class="relative z-10 pt-24 px-10 pb-16 max-w-7xl mx-auto"></main>

<script>
const pipelineData = [
  { id: 'PRJ-035', title: 'UI/UX Companion + Onboarding', client: 'BusinAI', value: 'R$ 41.200', stage: 'Imersão' },
  { id: 'PRJ-039', title: 'Identidade Visual + Site', client: 'Radar Agrotech', value: 'R$ 32.500', stage: 'Arquitetura' },
  { id: 'PRJ-042', title: 'Rebranding + Automação', client: 'Plectus Química', value: 'R$ 48.900', stage: 'Estresse' },
  { id: 'PRJ-037', title: 'Brand Book + Sistema', client: 'Emano Studio', value: 'R$ 27.800', stage: 'Escala' },
  { id: 'PRJ-031', title: 'Automação de Prospecção', client: 'Froc BioPremix', value: 'R$ 36.400', stage: 'Entregue' },
  { id: 'PRJ-044', title: 'Portal do Cliente', client: 'Advocacia de Grife', value: 'R$ 22.000', stage: 'Imersão' },
  { id: 'PRJ-041', title: 'Sequência de E-mail', client: 'Clínica Premium', value: 'R$ 18.500', stage: 'Arquitetura' }
];

function initPipeline() {
  const cols = document.querySelectorAll('.kanban-col');
  cols.forEach(col => {
    const cardsContainer = col.querySelector('.kanban-cards');
    cardsContainer.innerHTML = '';
    col.addEventListener('dragover', e => {
      e.preventDefault();
      col.classList.add('drag-over');
    });
    col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
    col.addEventListener('drop', e => {
      e.preventDefault();
      col.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      const card = document.querySelector(`[data-id="${id}"]`);
      if (card && cardsContainer) {
        cardsContainer.appendChild(card);
        card.classList.remove('dragging');
        const item = pipelineData.find(p => p.id === id);
        if (item) item.stage = col.dataset.stage;
        updatePipelineCounts();
        // subtle drop animation
        card.style.transform = 'scale(1.03)';
        setTimeout(() => card.style.transform = '', 180);
      }
    });
  });

  pipelineData.forEach(p => {
    const col = document.querySelector(`.kanban-col[data-stage="${p.stage}"] .kanban-cards`);
    if (!col) return;
    const card = document.createElement('div');
    card.className = 'deal glass-hi rounded-xl p-3 cursor-grab active:cursor-grabbing';
    card.draggable = true;
    card.dataset.id = p.id;
    card.innerHTML = `
      <div class="flex justify-between items-start gap-2">
        <div>
          <strong class="text-sm">${p.title}</strong>
          <div class="text-xs text-[var(--muted)] mt-1">${p.client} · ${p.value}</div>
        </div>
        <button class="remove-project text-[#f6a2ab] text-xs px-1.5 py-0.5 rounded hover:bg-white/10" data-id="${p.id}">✕</button>
      </div>
    `;
    card.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', p.id);
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
    card.querySelector('.remove-project').addEventListener('click', (e) => {
      e.stopPropagation();
      e.preventDefault();
      if (confirm('Remover este projeto do pipeline?')) {
        const idx = pipelineData.findIndex(item => item.id === p.id);
        if (idx > -1) pipelineData.splice(idx, 1);
        card.remove();
        updatePipelineCounts();
      }
    });
    card.querySelector('.remove-project').addEventListener('mousedown', e => e.stopPropagation());
    col.appendChild(card);
  });

  updatePipelineCounts();

  const addBtn = document.getElementById('add-pipeline-project');
  if (addBtn) {
    addBtn.onclick = () => {
      const title = prompt('Nome do projeto:');
      if (!title) return;
      const client = prompt('Cliente:') || 'Novo cliente';
      const value = prompt('Valor (ex: R$ 25.000):') || 'R$ 0';
      const id = 'PRJ-' + (100 + pipelineData.length);
      const newProject = { id, title, client, value, stage: 'Imersão' };
      pipelineData.push(newProject);
      initPipeline();
    };
  }
}

function updatePipelineCounts() {
  document.querySelectorAll('.kanban-col').forEach(col => {
    const count = col.querySelectorAll('.deal').length;
    const meta = col.querySelector('[data-count]');
    if (meta) meta.textContent = `${count} projeto${count !== 1 ? 's' : ''}`;
  });
}

              <div class="text-right text-[var(--muted)]">${d.date}</div>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="mb-8">
        <h3 class="font-medium mb-2">Sobre o projeto</h3>
        <p class="text-sm text-[var(--muted)] leading-relaxed">${p.description}</p>
      </div>

      <div class="flex gap-3">
        <button class="bg-[var(--accent)] text-[#1a120e] px-5 py-2 rounded-full text-sm font-semibold">Atualizar status</button>
        <button class="glass px-5 py-2 rounded-full text-sm">Arquivos</button>
        <button class="glass px-5 py-2 rounded-full text-sm">Comentários</button>
        <button id="gerar-projeto-pdf" class="glass px-5 py-2 rounded-full text-sm">Gerar PDF</button>
      </div>
    </div>
  `;
  document.getElementById('projeto-list').classList.add('hidden');
  detail.classList.remove('hidden');
  document.getElementById('back-to-projetos').addEventListener('click', () => {
    detail.classList.add('hidden');
    document.getElementById('projeto-list').classList.remove('hidden');
  });
  const pdfBtn = document.getElementById('gerar-projeto-pdf');
  if (pdfBtn) pdfBtn.addEventListener('click', () => exportProjetoPDF(id));
}

const allLeads = [
  { id: 'LD-2041', name: 'Marina Costa', company: 'Clínica Premium SP', source: 'WhatsApp', status: 'Qualificado', statusColor: 'text-[#84d9aa]', score: 86, value: 'R$ 38k' },
  { id: 'LD-2038', name: 'Ricardo Alves', company: 'Advocacia de Grife', source: 'Indicação', status: 'Em negociação', statusColor: 'text-[#f0c477]', score: 92, value: 'R$ 52k' },
  { id: 'LD-2035', name: 'Startup Orbit', company: 'SaaS B2B', source: 'Site', status: 'Novo', statusColor: 'text-[var(--accent)]', score: 64, value: 'R$ 24k' },
  { id: 'LD-2031', name: 'Helena Martins', company: 'Consultoria Executiva', source: 'LinkedIn', status: 'Qualificado', statusColor: 'text-[#84d9aa]', score: 78, value: 'R$ 31k' },
  { id: 'LD-2027', name: 'Grupo Horizonte', company: 'Corporação', source: 'Evento', status: 'Perdido', statusColor: 'text-[#f6a2ab]', score: 45, value: 'R$ 67k' }
];

function renderLeadList(leads) {
  const container = document.getElementById('lead-list');
  if (!container) return;
  if (leads.length === 0) {
    container.innerHTML = `<div class="glass rounded-2xl p-8 text-center text-[var(--muted)]">Nenhum lead encontrado</div>`;
    return;
  }
  container.innerHTML = leads.map(l => `
    <div class="lead-card glass rounded-2xl p-5 flex items-center justify-between cursor-pointer hover:bg-white/5 transition" data-id="${l.id}">
      <div class="flex items-center gap-5">
        <div class="text-xs font-mono text-[var(--muted)] w-20">${l.id}</div>
        <div>
          <div class="font-medium">${l.name}</div>
          <div class="text-sm text-[var(--muted)] mt-0.5">${l.company} · ${l.source}</div>
        </div>
      </div>
      <div class="flex items-center gap-8">
        <div class="text-right min-w-[90px]">
          <div class="font-semibold">${l.value}</div>
          <div class="text-xs ${l.statusColor} mt-0.5">${l.status}</div>
        </div>
        <div class="text-right min-w-[50px]">
          <div class="text-xs text-[var(--muted)]">Score</div>
          <div class="font-medium">${l.score}</div>
        </div>
        <div class="text-[var(--muted)]">→</div>
      </div>
    </div>
  `).join('');
  container.querySelectorAll('.lead-card').forEach(card => {
    card.addEventListener('click', () => openLead(card.dataset.id));
  });
}

function exportProjetoPDF(id) {
  const p = projetosData[id];
  if (!p) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(18);
  doc.text('EMANOMIND · Relatório de Projeto', 14, 20);
  doc.setFontSize(12);
  doc.text(p.title, 14, 32);
  doc.setFontSize(11);
  doc.setTextColor(80);
  doc.text(`Cliente: ${p.client}`, 14, 42);
  doc.text(`Valor: ${p.value}`, 14, 50);
  doc.text(`Etapa: ${p.stage} · ${p.progress}%`, 14, 58);
  doc.text(`Entrega: ${p.deadline}`, 14, 66);
  doc.text(`Responsável: ${p.responsible}`, 14, 74);

  doc.setTextColor(0);
  doc.setFontSize(13);
  doc.text('Entregáveis', 14, 90);
  let y = 100;
  (p.deliverables || []).forEach(d => {
    if (y > 270) { doc.addPage(); y = 20; }
    doc.setFontSize(11);
    doc.text(`${d.name} — ${d.status}`, 14, y);
    doc.setFontSize(10);
    doc.setTextColor(80);
    doc.text(d.date, 20, y + 6);
    doc.setTextColor(0);
    y += 14;
  });

  doc.save(`EMANOMIND-Projeto-${id}.pdf`);
}

function exportPropostaPDF(id) {
  const p = propostasData[id];
  if (!p) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(18);
  doc.text('EMANOMIND · Proposta Comercial', 14, 20);
  doc.setFontSize(12);
  doc.text(p.title, 14, 32);
  doc.setFontSize(11);
  doc.setTextColor(80);
  doc.text(`Cliente: ${p.client}`, 14, 42);
  doc.text(`Valor: ${p.value}`, 14, 50);
  doc.text(`Status: ${p.status}`, 14, 58);
  doc.text(`Prazo: ${p.timeline || p.valid}`, 14, 66);

  doc.setTextColor(0);
  doc.setFontSize(13);
  doc.text('Escopo', 14, 80);
  let y = 90;
  (p.scope || []).forEach(s => {
    if (y > 270) { doc.addPage(); y = 20; }
    doc.setFontSize(11);
    doc.text(`${s.n}  ${s.t}`, 14, y);
    doc.setFontSize(10);
    doc.setTextColor(80);
    doc.text(s.d, 20, y + 6, { maxWidth: 170 });
    doc.setTextColor(0);
    y += 16;
  });

  doc.save(`EMANOMIND-Proposta-${id}.pdf`);
}

function exportLeadsPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const search = (document.getElementById('lead-search')?.value || '').toLowerCase();
  const status = document.getElementById('lead-status-filter')?.value || '';
  const source = document.getElementById('lead-source-filter')?.value || '';
  const filtered = allLeads.filter(l => {
    const matchesSearch = !search || l.name.toLowerCase().includes(search) || l.company.toLowerCase().includes(search) || l.id.toLowerCase().includes(search);
    const matchesStatus = !status || l.status === status;
    const matchesSource = !source || l.source === source;
    return matchesSearch && matchesStatus && matchesSource;
  });

  doc.setFontSize(18);
  doc.text('EMANOMIND · Relatório de Leads', 14, 20);
  doc.setFontSize(11);
  doc.setTextColor(100);
  doc.text(`Gerado em ${new Date().toLocaleDateString('pt-BR')} · ${filtered.length} leads`, 14, 28);

  let y = 42;
  filtered.forEach((l, i) => {
    if (y > 270) {
      doc.addPage();
      y = 20;
    }
    doc.setFontSize(12);
    doc.setTextColor(0);
    doc.text(`${l.id} · ${l.name}`, 14, y);
    doc.setFontSize(10);
    doc.setTextColor(80);
    doc.text(`${l.company} · ${l.source} · ${l.status} · Score ${l.score} · ${l.value}`, 14, y + 6);
    y += 16;
  });

  doc.save(`EMANOMIND-Leads-${new Date().toISOString().slice(0,10)}.pdf`);
}

function filterLeads() {
  const search = (document.getElementById('lead-search')?.value || '').toLowerCase();
  const status = document.getElementById('lead-status-filter')?.value || '';
  const source = document.getElementById('lead-source-filter')?.value || '';
  const filtered = allLeads.filter(l => {
    const matchesSearch = !search || 
      l.name.toLowerCase().includes(search) || 
      l.company.toLowerCase().includes(search) || 
      l.id.toLowerCase().includes(search);
    const matchesStatus = !status || l.status === status;
    const matchesSource = !source || l.source === source;
    return matchesSearch && matchesStatus && matchesSource;
  });
  renderLeadList(filtered);
}

    const segment = document.getElementById('edit-segment').value.trim();
    const contact = document.getElementById('edit-contact').value.trim();
    const email = document.getElementById('edit-email').value.trim();
    const phone = document.getElementById('edit-phone').value.trim();
    const ltv = document.getElementById('edit-ltv').value.trim();
    const notes = document.getElementById('edit-notes').value.trim();

    // Clear previous errors
    document.querySelectorAll('.field-error').forEach(el => el.remove());
    document.querySelectorAll('input, textarea').forEach(el => el.classList.remove('border-red-400'));

    let hasError = false;

    function showError(inputId, message) {
      const input = document.getElementById(inputId);
      input.classList.add('border-red-400');
      const err = document.createElement('div');
      err.className = 'field-error text-xs text-[#f6a2ab] mt-1';
      err.textContent = message;
      input.parentNode.appendChild(err);
      hasError = true;
    }

    if (!name) showError('edit-name', 'Nome é obrigatório');
    if (!contact) showError('edit-contact', 'Contato é obrigatório');
    if (!email) {
      showError('edit-email', 'E-mail é obrigatório');
    } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showError('edit-email', 'E-mail inválido');
    }
    if (phone && phone.length < 8) {
      showError('edit-phone', 'Telefone muito curto');
    }

    if (hasError) return;

    c.name = name;
    c.segment = segment;
    c.contact = contact;
    c.email = email;
    c.phone = phone;
    c.ltv = ltv;
    c.notes = notes;
    openCliente(id);
    const card = document.querySelector(`.cliente-card[data-id="${id}"]`);
    if (card) {
      card.querySelector('.font-medium').textContent = c.name;
      card.querySelector('.text-sm').textContent = `${c.segment} · ${c.projects?.length || 0} projeto(s) aberto(s)`;
      card.querySelector('.font-semibold').textContent = c.ltv;
    }
  });
}

function exportClientePDF(id) {
  const c = clientesData[id];
  if (!c) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(18);
  doc.text('EMANOMIND · Ficha do Cliente', 14, 20);
  doc.setFontSize(12);
  doc.text(c.name, 14, 32);
  doc.setFontSize(11);
  doc.setTextColor(80);
  doc.text(`Segmento: ${c.segment}`, 14, 42);
  doc.text(`Lifetime Value: ${c.ltv}`, 14, 50);
  doc.text(`Status: ${c.status}`, 14, 58);
  doc.text(`Cliente desde: ${c.since}`, 14, 66);
  doc.text(`Contato: ${c.contact}`, 14, 74);
  doc.text(`E-mail: ${c.email}`, 14, 82);
  doc.text(`Telefone: ${c.phone}`, 14, 90);

  doc.setTextColor(0);
  doc.setFontSize(13);
  doc.text('Projetos', 14, 105);
  let y = 115;
  c.projects.forEach(p => {
    doc.setFontSize(11);
    doc.setTextColor(60);
    doc.text(`• ${p}`, 14, y);
    y += 8;
  });

  doc.setTextColor(0);
  doc.setFontSize(13);
  doc.text('Notas', 14, y + 10);
  doc.setFontSize(11);
  doc.setTextColor(60);
  doc.text(c.notes, 14, y + 20, { maxWidth: 180 });

  doc.save(`EMANOMIND-Cliente-${id}.pdf`);
}

    detail.classList.add('hidden');
    document.getElementById('contrato-list').classList.remove('hidden');
  });
  const pdfBtn = document.getElementById('gerar-contrato-pdf');
  if (pdfBtn) pdfBtn.addEventListener('click', () => exportContratoPDF(id));
}

function exportContratoPDF(id) {
  const c = contratosData[id];
  if (!c) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(18);
  doc.text('EMANOMIND · Contrato', 14, 20);
  doc.setFontSize(12);
  doc.text(c.title, 14, 32);
  doc.setFontSize(11);
  doc.setTextColor(80);
  doc.text(`Cliente: ${c.client}`, 14, 42);
  doc.text(`Valor: ${c.value}`, 14, 50);
  doc.text(`Status: ${c.status}`, 14, 58);
  doc.text(`Vigência: ${c.start} a ${c.end}`, 14, 66);
  doc.text(`Responsável: ${c.responsible}`, 14, 74);

  doc.setTextColor(0);
  doc.setFontSize(13);
  doc.text('Escopo', 14, 90);
  doc.setFontSize(11);
  doc.setTextColor(60);
  doc.text(c.scope, 14, 100, { maxWidth: 180 });

  doc.setTextColor(0);
  doc.setFontSize(13);
  doc.text('Condições', 14, 125);
  doc.setFontSize(11);
  doc.setTextColor(60);
  doc.text(c.terms, 14, 135, { maxWidth: 180 });

  doc.save(`EMANOMIND-Contrato-${id}.pdf`);
}

          </div>
        </div>
      `).join('')}
    </div>
    <div id="contrato-detail" class="hidden"></div>
  `,
  clientes: `
    <div class="flex items-end justify-between mb-6">
      <div>
        <h1 class="text-3xl font-medium mb-1">Clientes</h1>
        <p class="text-[var(--muted)]">21 contas ativas · 4 canais (Corporações, Premium, Startups, Tech)</p>
      </div>
      <button class="bg-[var(--accent)] text-[#1a120e] px-5 py-2 rounded-full text-sm font-semibold">Novo cliente</button>
    </div>

    <div class="grid grid-cols-4 gap-4 mb-6">
      <div class="glass rounded-2xl p-5"><div class="text-xs text-[var(--muted)]">Ativos</div><div class="text-2xl font-semibold mt-1">21</div></div>
      <div class="glass rounded-2xl p-5"><div class="text-xs text-[var(--muted)]">Lifetime Value</div><div class="text-2xl font-semibold mt-1">R$ 1.86M</div></div>
      <div class="glass rounded-2xl p-5"><div class="text-xs text-[var(--muted)]">Com projeto aberto</div><div class="text-2xl font-semibold mt-1">14</div></div>
      <div class="glass rounded-2xl p-5"><div class="text-xs text-[var(--muted)]">Ticket médio</div><div class="text-2xl font-semibold mt-1">R$ 38.2k</div></div>
    </div>

    <div id="cliente-list" class="space-y-3">
      ${[
        { id: 'CLI-012', name: 'Plectus Química', segment: 'Corporação', ltv: 'R$ 186k', projects: 2, status: 'Ativo' },
        { id: 'CLI-009', name: 'Radar Agrotech', segment: 'Agrotech', ltv: 'R$ 92k', projects: 1, status: 'Ativo' },
        { id: 'CLI-007', name: 'Emano Studio', segment: 'Premium', ltv: 'R$ 74k', projects: 1, status: 'Ativo' },
        { id: 'CLI-005', name: 'BusinAI', segment: 'SaaS / Tech', ltv: 'R$ 41k', projects: 1, status: 'Ativo' },
        { id: 'CLI-003', name: 'Froc BioPremix', segment: 'Agrotech', ltv: 'R$ 36k', projects: 0, status: 'Concluído' }
      ].map(c => `
        <div class="cliente-card glass rounded-2xl p-5 flex items-center justify-between hover:bg-white/5 transition" data-id="${c.id}">
          <div class="flex items-center gap-5 cursor-pointer flex-1" data-action="open">
            <div class="text-xs font-mono text-[var(--muted)] w-20">${c.id}</div>
            <div>
              <div class="font-medium">${c.name}</div>
              <div class="text-sm text-[var(--muted)] mt-0.5">${c.segment} · ${c.projects} projeto(s) aberto(s)</div>
            </div>
          </div>
          <div class="flex items-center gap-4">
            <div class="text-right min-w-[80px]">
              <div class="font-semibold">${c.ltv}</div>
              <div class="text-xs text-[#84d9aa] mt-0.5">${c.status}</div>
            </div>
            <button data-action="manage" class="glass px-3 py-1.5 rounded-lg text-xs">Gerenciar</button>
            <button data-action="delete" class="glass px-3 py-1.5 rounded-lg text-xs text-[#f6a2ab]">Excluir</button>
          </div>
        </div>
      `).join('')}
    </div>
    <div id="cliente-detail" class="hidden"></div>
  `,
  equipe: `
    <h1 class="text-3xl font-medium mb-1">Equipe</h1>
    <p class="text-[var(--muted)] mb-6">Desempenho e metas do trimestre</p>
    <div class="glass rounded-2xl p-5">
      <div class="flex justify-between py-3 border-b border-white/10"><div><strong>João Emanuel</strong><br><span class="text-sm text-[var(--muted)]">Fundador · Estratégia</span></div><div>68% da meta</div></div>
      <div class="flex justify-between py-3"><div><strong>Designer Sênior</strong><br><span class="text-sm text-[var(--muted)]">Identidade Visual</span></div><div>54% da meta</div></div>
    </div>
  `,
  relatorios: `<h1 class="text-3xl font-medium mb-1">Relatórios</h1><p class="text-[var(--muted)] mb-6">Exportação e visão consolidada</p><div class="glass rounded-2xl p-6">Construtor de relatórios e exportação CSV (em construção)</div>`
};

function openProposta(id) {
  const p = propostasData[id] || propostasData['P-1187'];
  const detail = document.getElementById('proposta-detail');
  detail.innerHTML = `
    <button id="back-to-list" class="text-sm text-[var(--muted)] mb-5 flex items-center gap-1 hover:text-white">← Voltar para propostas</button>
    <div class="glass rounded-2xl p-8">
      <div class="flex justify-between items-start mb-8">
        <div>
          <div class="text-xs text-[var(--muted)] tracking-wider">PROPOSTA ${id}</div>
          <h2 class="text-2xl font-medium mt-1">${p.title}</h2>
          <div class="text-[var(--muted)] mt-1">${p.client} · ${p.valid}</div>
        </div>
        <div class="text-right">
          <div class="text-3xl font-semibold text-[var(--accent)]">${p.value}</div>
          <div class="text-xs ${p.statusClass} mt-1">${p.status} · ${p.views}</div>
        </div>
      </div>
      <div class="grid grid-cols-3 gap-6 mb-8">
        <div class="glass-hi rounded-xl p-4"><div class="text-xs text-[var(--muted)]">Cliente</div><div class="font-medium mt-1">${p.client}</div></div>
        <div class="glass-hi rounded-xl p-4"><div class="text-xs text-[var(--muted)]">Responsável</div><div class="font-medium mt-1">João Emanuel</div><div class="text-sm text-[var(--muted)]">Atendimento direto</div></div>
        <div class="glass-hi rounded-xl p-4"><div class="text-xs text-[var(--muted)]">Prazo estimado</div><div class="font-medium mt-1">${p.timeline}</div><div class="text-sm text-[var(--muted)]">Imersão → Escala</div></div>
      </div>
      <div class="mb-8">
        <h3 class="font-medium mb-3">Escopo</h3>
        <div class="space-y-3 text-sm">
          ${p.scope.map(s => `<div class="flex gap-3"><span class="text-[var(--accent)]">${s.n}</span> <div><strong>${s.t}</strong> — ${s.d}</div></div>`).join('')}
        </div>
      </div>
      <div class="mb-8">
        <h3 class="font-medium mb-3">Investimento</h3>
        <div class="glass-hi rounded-xl overflow-hidden text-sm">
          <div class="grid grid-cols-3 px-4 py-3 border-b border-white/10 text-[var(--muted)] text-xs"><div>Entregável</div><div>Prazo</div><div class="text-right">Valor</div></div>
          ${p.pricing.map(row => `<div class="grid grid-cols-3 px-4 py-3 border-b border-white/5"><div>${row.item}</div><div>${row.time}</div><div class="text-right">${row.value}</div></div>`).join('')}
          <div class="grid grid-cols-3 px-4 py-3 font-medium"><div>Total</div><div>${p.timeline}</div><div class="text-right text-[var(--accent)]">${p.value}</div></div>
        </div>
      </div>
      <div class="flex gap-3">
        <button class="bg-[var(--accent)] text-[#1a120e] px-5 py-2 rounded-full text-sm font-semibold">Enviar proposta</button>
        <button class="glass px-5 py-2 rounded-full text-sm">Editar</button>
        <button id="gerar-proposta-pdf" class="glass px-5 py-2 rounded-full text-sm">Gerar PDF</button>
      </div>
    </div>
  `;
  document.getElementById('proposta-list').classList.add('hidden');
  detail.classList.remove('hidden');
  document.getElementById('back-to-list').addEventListener('click', () => {
    detail.classList.add('hidden');
    document.getElementById('proposta-list').classList.remove('hidden');
  });
  const pdfBtn = document.getElementById('gerar-proposta-pdf');
  if (pdfBtn) pdfBtn.addEventListener('click', () => exportPropostaPDF(id));
}

function render(page) {
  const main = document.getElementById('main');
  main.style.opacity = '0';
  main.style.transform = 'translateY(6px)';
  setTimeout(() => {
    main.innerHTML = pages[page] || pages.visao;
    main.classList.remove('page-enter');
    void main.offsetWidth;
    main.classList.add('page-enter');
    main.style.opacity = '';
    main.style.transform = '';

    document.querySelectorAll('.nav-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.page === page);
      b.style.color = b.dataset.page === page ? '#1a120e' : 'var(--muted)';
    });
    movePill(page);

    if (page === 'pipeline') initPipeline();
    if (page === 'propostas') {
      document.querySelectorAll('.proposta-card').forEach(card => {
        card.addEventListener('click', () => openProposta(card.dataset.id));
      });
    }
    if (page === 'contratos') {
      document.querySelectorAll('.contrato-card').forEach(card => {
        card.addEventListener('click', () => openContrato(card.dataset.id));
      });
    }
    if (page === 'clientes') {
      document.querySelectorAll('.cliente-card').forEach(card => {
        const id = card.dataset.id;
        card.querySelector('[data-action="open"]')?.addEventListener('click', () => openCliente(id));
        card.querySelector('[data-action="manage"]')?.addEventListener('click', (e) => {
          e.stopPropagation();
          openCliente(id);
        });
        card.querySelector('[data-action="delete"]')?.addEventListener('click', (e) => {
          e.stopPropagation();
          if (confirm('Excluir este cliente? Esta ação não pode ser desfeita.')) {
            card.remove();
          }
        });
      });
    }
    if (page === 'projetos') {
      document.querySelectorAll('.projeto-card').forEach(card => {
        card.addEventListener('click', () => openProjeto(card.dataset.id));
      });
    }
    if (page === 'processos') {
      document.querySelectorAll('.processo-card').forEach(card => {
        card.addEventListener('click', () => openProcesso(card.dataset.id));
      });
    }
    if (page === 'leads') {
      renderLeadList(allLeads);
      const search = document.getElementById('lead-search');
      const status = document.getElementById('lead-status-filter');
      const source = document.getElementById('lead-source-filter');
      const exportBtn = document.getElementById('export-leads-pdf');
      const excelBtn = document.getElementById('export-leads-excel');
      if (search) search.addEventListener('input', filterLeads);
      if (status) status.addEventListener('change', filterLeads);
      if (source) source.addEventListener('change', filterLeads);
      if (exportBtn) exportBtn.addEventListener('click', exportLeadsPDF);
      if (excelBtn) excelBtn.addEventListener('click', exportLeadsExcel);
    }
  }, 120);
}

function movePill(page) {
  const btn = document.querySelector(`[data-page="${page}"]`);
  const pill = document.getElementById('pill');
  const nav = document.getElementById('nav');
  if (!btn || !pill || !nav) return;
  const navRect = nav.getBoundingClientRect();
  const btnRect = btn.getBoundingClientRect();
  pill.style.left = (btnRect.left - navRect.left) + 'px';
  pill.style.width = btnRect.width + 'px';
}

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => render(btn.dataset.page));
});

render('visao');
window.addEventListener('resize', () => {
  const active = document.querySelector('.nav-btn.active');
  if (active) movePill(active.dataset.page);
});
</script>
</body>
</html>
